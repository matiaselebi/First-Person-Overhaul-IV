; FirstPersonCutscene.ini -- settings for the GTA IV first-person mod (0.5.0-beta-pad1).
; The values below are the defaults. Delete a line (or this whole file) to get the default back.
; Edit while the game runs, then press Ctrl+SaveKey (Ctrl+F5 by default) to reload.
; In debug mode (Ctrl+ToggleKey) you can also tune live with the keys from the README and press
; SaveKey (F5) to write the current values back into this file. Lines starting with ; are comments.

[General]
; Basic switches and mouse look.

; 1 = first person is already on when the game loads; 0 = press ToggleKey to turn it on.
StartEnabled = 0

; Key that turns first person on/off: F1-F12, a letter or digit, or a hex virtual-key code such as 0x76. Ctrl + this key toggles debug mode.
ToggleKey = F7

; Key that saves your current in-game settings into this file (Ctrl + it reloads the file). Same key names as ToggleKey, or none to disable. Works with or without debug mode.
SaveKey = F5

; 1 = show a short on-screen message when settings are saved or reloaded.
ShowMessages = 1

; 1 = debug mode starts on. It unlocks the live-tuning keys (see the README): tune with them in game, then press SaveKey to keep the values.
DebugMode = 0

; Hide Niko's head and hair so they don't block the view. Turn off only for debugging.
HideHead = 1

; Look speed in radians per mouse count. Raise it to look around faster, lower it for slower.
MouseSensitivity = 0.0016

; 1 = invert vertical mouse look.
InvertY = 0

; How far up/down you can look, in degrees (30 - 89).
MaxPitchDegrees = 74.5

[Controller]
CarLookMaxRightDegrees = 150
CarLookMaxLeftDegrees = 130
; Controller support (pad1): camera-button cycle and right-stick look.

; 1 = first person is one more step of the game's camera button (touchpad / Back / V): near, normal, far, first person, near again.
CameraCycle = 1

; 1 = on foot the view follows the game camera, so the right stick and the mouse look around and you always walk where you look. 0 = original mouse-only look.
FollowGameCameraOnFoot = 1

; Degrees added to the on-foot look pitch (positive = look a bit higher), if the view feels tilted down.
OnFootPitchOffset = 0.0

; How fast the right stick turns your head in a vehicle, radians per second at full deflection.
CarStickSpeed = 3.00

; How far you can turn your head in a vehicle with the stick (150 = over the shoulder to the rear window). The look-behind button always shows straight back.
CarLookMaxDegrees = 150

; 1 = in a vehicle the view returns to the front a moment after you let go of the stick.
CarAutoCenter = 1

; 1 = invert the right stick's up/down in a vehicle (on foot the game's own invert setting applies).
InvertY = 0
CarFirstPersonAfter= 4
ShowCarCameraNumber= 0
TurnBodyWithView= 1

[OnFoot]
; Camera tuning on foot. OnFoot / Car / Train each have their own eye height, eye forward and FOV boost.

; Camera height offset in metres, added to the head (on foot) or the seat position (car, train). Positive = higher.
EyeHeight = 0.060

; Camera offset forward along the view, in metres. Positive = toward the nose / away from the back of your head.
EyeForward = 0.180

; Degrees added to the game's own field of view (negative narrows it). Ultra-wide, very large or very small screens usually want a different value: raise it for a wider view, lower it if the edges look stretched.
FovBoost = 0.0
; Field of view while looking level on foot (looking up/down still eases the game change in). 0 = game FOV.
BaseFov = 0.0

[Car]
; Camera tuning in a car (same keys as [OnFoot]).
EyeHeight = 0.090
EyeForward = 0.120
FovBoost = 10.0

[Train]
; Camera tuning on the subway / trains (same keys as [OnFoot]).
EyeHeight = 0.330
EyeForward = 0.050
FovBoost = 18.0

[Aim]
; Aiming (hold RMB, on foot): how the camera lines up with where the bullets go.

; While aiming (hold RMB, on foot) take yaw/pitch from the game's aim camera so shots land on the crosshair. Turning this off brings the missed shots back.
AlignToAimCamera = 1

; Also slide the eye onto the game's aim ray so the crosshair is exactly the bullet line.
EyeOnAimRay = 1

; Where the aim ray starts: center = over your head (default), right = the game's own over-the-right-shoulder view, left = over the left shoulder.
AimSide = center

; Experimental: also raise the aim ray to your eye height.
AimRayToEyeHeight = 0

[AimEyeForward]
; Per-weapon eye offset while aiming.

; Extra eye offset while aiming, in metres (+ forward, - back), per weapon slot (category), so long guns' stocks don't clip the screen. Slot5 = assault rifles (M4, AK47...). The log prints "weapon changed: type=.. slot=.." for each gun you equip. Add a Weapon<type> = value line to override a single weapon.
Slot0 = -0.020
Slot1 = -0.020
Slot2 = -0.020
Slot3 = -0.100
Slot4 = -0.040
Slot5 = -0.100
Slot6 = -0.100
Slot7 = -0.080
Slot8 = -0.020
Slot9 = 0.000
Slot10 = 0.000
Slot11 = 0.000
Slot12 = 0.000
Slot13 = 0.000
Slot14 = 0.000
Slot15 = 0.000

[AimEyeHeight]
; Per-weapon eye height while aiming, metres (+ up, - down). Slot3 = shotguns, Slot5 = assault rifles (M4, AK47).
Slot0 = 0.000
Slot1 = 0.000
Slot2 = 0.000
Slot3 = 0.040
Slot4 = 0.000
Slot5 = 0.050
Slot6 = 0.000
Slot7 = 0.000
Slot8 = 0.000
Slot9 = 0.000
